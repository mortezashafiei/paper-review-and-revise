name: Check and package skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Validate SKILL.md and the venue profiles
        run: python scripts/check_skill.py

  package:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the upload-ready zip
        run: |
          mkdir -p dist/paper-review-and-revise
          cp -r SKILL.md LICENSE field-checklists.md venues dist/paper-review-and-revise/
          cd dist
          zip -r paper-review-and-revise.zip paper-review-and-revise
          unzip -l paper-review-and-revise.zip
      - name: Publish it as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete skill-latest --yes --cleanup-tag || true
          gh release create skill-latest dist/paper-review-and-revise.zip \
            --target "$GITHUB_SHA" \
            --title "Paper Review and Revise (latest)" \
            --notes "Download paper-review-and-revise.zip below, then upload it in Claude under Customize > Skills > + > Create skill > Upload a skill. This release is rebuilt automatically whenever the main branch changes." \
            --latest
